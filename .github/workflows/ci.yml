name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scanning (Gitleaks CLI)
        run: |
          GITLEAKS_VERSION="8.30.1"
          GITLEAKS_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum --check -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git . --config .gitleaks.toml --redact --no-banner
          /tmp/gitleaks dir . --config .gitleaks.toml --redact --no-banner

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Dead code and unused exports check (Knip)
        run: pnpm check:deadcode

      - name: Run unit & integration tests
        run: pnpm test

      - name: Production build check
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: "1"
          DB_PATH: /tmp/kotonoba-ci.db
          UPLOAD_DIR: /tmp/kotonoba-ci-uploads
        run: pnpm build

      - name: Dependency audit (critical)
        run: pnpm audit --audit-level=critical

  e2e:
    name: Playwright E2E Security & Smoke Tests
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production standalone server for E2E
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: "1"
          DB_PATH: /tmp/kotonoba-e2e-build.db
          UPLOAD_DIR: /tmp/kotonoba-e2e-build-uploads
        run: pnpm build

      - name: Install Chromium browser for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright E2E suite
        run: pnpm test:e2e

      - name: Upload Playwright trace artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-traces
          path: test-results/
          retention-days: 7
