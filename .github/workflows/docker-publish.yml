name: Release and Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
      - "v*.*.*-*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js (for package.json inspection)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Determine Semantic Version (from package.json)
        id: versioning
        run: |
          # Read version directly from package.json as single source of truth
          PKG_VER=$(node -p "require('./package.json').version")

          CLEAN_VER="${PKG_VER#v}"
          TAG_NAME="v${CLEAN_VER}"
          IS_PRERELEASE="false"
          if [[ "$CLEAN_VER" == *-* ]]; then
            IS_PRERELEASE="true"
          fi

          echo "VERSION=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "CLEAN_VERSION=${CLEAN_VER}" >> $GITHUB_OUTPUT
          echo "IS_PRERELEASE=${IS_PRERELEASE}" >> $GITHUB_OUTPUT
          echo "Version from package.json: ${CLEAN_VER} (Tag: ${TAG_NAME}, Pre-release: ${IS_PRERELEASE})"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Tags & Metadata (SemVer)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ steps.versioning.outputs.IS_PRERELEASE == 'false' }}
            type=semver,pattern={{version}},value=${{ steps.versioning.outputs.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.versioning.outputs.VERSION }},enable=${{ steps.versioning.outputs.IS_PRERELEASE == 'false' }}
            type=semver,pattern={{major}},value=${{ steps.versioning.outputs.VERSION }},enable=${{ steps.versioning.outputs.IS_PRERELEASE == 'false' }}
            type=raw,value=${{ steps.versioning.outputs.CLEAN_VERSION }}
            type=raw,value=${{ steps.versioning.outputs.VERSION }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create or Update GitHub Release with Changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.versioning.outputs.VERSION }}
          IS_PRERELEASE: ${{ steps.versioning.outputs.IS_PRERELEASE }}
        run: |
          echo "Processing GitHub Release for tag: ${TAG_NAME} (prerelease: ${IS_PRERELEASE})"
          
          PRERELEASE_FLAG=""
          if [ "${IS_PRERELEASE}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            echo "Release ${TAG_NAME} already exists. Updating..."
            gh release edit "${TAG_NAME}" --title "Kotonoba ${TAG_NAME}" ${PRERELEASE_FLAG}
          else
            echo "Creating new release ${TAG_NAME}..."
            gh release create "${TAG_NAME}" \
              --target "${GITHUB_SHA}" \
              --title "Kotonoba ${TAG_NAME}" \
              --generate-notes \
              ${PRERELEASE_FLAG}
          fi



