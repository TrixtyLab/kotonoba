<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <!-- Primary Accent Gradient -->
    <linearGradient id="logoAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Cyan Highlight Gradient -->
    <linearGradient id="logoCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Icon Background Container Gradient -->
    <linearGradient id="logoIconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <!-- ================= LOGO ICON SYMBOL (Left) ================= -->
  <g transform="translate(30, 20)">
    <!-- Icon Container Box -->
    <rect width="160" height="160" rx="38" fill="url(#logoIconBg)" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />

    <!-- Vector Monogram 'K' + Kanji '言' -->
    <g transform="translate(4, 0)">
      <!-- Top Accent Dot (Kanji 言 radical spark) -->
      <circle cx="56" cy="34" r="5" fill="#38BDF8" />

      <!-- Vertical Spine Pillar -->
      <rect x="48" y="46" width="16" height="88" rx="8" fill="url(#logoAccentGrad)" />

      <!-- Upper Speech Line -->
      <rect x="74" y="52" width="26" height="7" rx="3.5" fill="url(#logoCyanGrad)" opacity="0.9" />

      <!-- Chevrons / Wings forming 'K' -->
      <path
        d="M 74 84 
           C 74 79, 78 75, 83 73 
           L 110 58 
           C 117 54, 125 59, 125 66 
           C 125 70, 122 73, 119 75 
           L 94 88 
           C 90 90, 90 94, 94 96 
           L 120 110 
           C 123 112, 125 116, 125 119 
           C 125 127, 117 131, 111 128 
           L 83 112 
           C 78 110, 74 106, 74 101 
           Z"
        fill="url(#logoAccentGrad)"
      />

      <!-- Central Pivot Node -->
      <circle cx="87" cy="90" r="5.5" fill="#38BDF8" />
    </g>
  </g>

  <!-- ================= LOGOTYPE TYPOGRAPHY (Right) ================= -->
  <g transform="translate(225, 108)">
    <!-- Brand Name: KOTONOBA -->
    <text
      x="0"
      y="0"
      font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="64"
      font-weight="800"
      letter-spacing="-0.04em"
      fill="#F8FAFC"
    >
      Kotonoba
    </text>

    <!-- Japanese Kanji & CMS Category Badge -->
    <g transform="translate(325, -46)">
      <!-- Pill Container -->
      <rect x="0" y="0" width="105" height="30" rx="15" fill="#1E293B" stroke="#475569" stroke-width="1" />
      <text
        x="52.5"
        y="20"
        font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif"
        font-size="14"
        font-weight="600"
        letter-spacing="0.08em"
        fill="#818CF8"
        text-anchor="middle"
      >
        言の場
      </text>
    </g>

    <!-- Subtitle / Tagline -->
    <text
      x="2"
      y="38"
      font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="15"
      font-weight="500"
      letter-spacing="0.06em"
      fill="#94A3B8"
    >
      MODERN MULTI-TENANT BLOG CMS
    </text>
  </g>
</svg>
