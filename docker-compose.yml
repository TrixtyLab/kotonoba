services:
  kotonoba:
    image: ghcr.io/trixtylab/kotonoba:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DB_PATH: /app/data/kotonoba.db
      UPLOAD_DIR: /app/data/uploads
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (32+ chars)}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY (32+ chars, distinct from JWT_SECRET)}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      CSP_MODE: ${CSP_MODE:-report-only}
    volumes:
      - blog_data:/app/data

volumes:
  blog_data: {}
