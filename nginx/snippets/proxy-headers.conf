# Forwarding headers for every proxied location.
# nginx is the only trusted edge: overwrite addressing headers instead of
# appending to client-supplied values.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;

# Drop CDN/edge headers that a direct client could otherwise spoof.
# Country is forwarded only when cloudflare-country.conf marks the peer as Cloudflare.
proxy_set_header CF-Connecting-IP "";
proxy_set_header CF-IPCountry $forwarded_cf_ipcountry;
proxy_set_header True-Client-IP "";
proxy_set_header X-Client-IP "";
proxy_set_header X-Vercel-IP-Country "";
