# Locations shared by the public TLS server and the internal listener.
# Keep every proxy_set_header in proxy-headers.conf so both listeners behave
# identically and no client-supplied addressing header is trusted.

# Block hidden dotfiles except ACME/well-known probes
location ~ /\.(?!well-known) {
    deny all;
    return 404;
}

# Versioned Next.js static bundles
location /_next/static/ {
    proxy_pass http://blog_backend;
    proxy_http_version 1.1;
    include /etc/nginx/snippets/proxy-headers.conf;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# SSE / real-time analytics stream
location = /api/analytics/realtime {
    proxy_pass http://blog_backend;
    proxy_http_version 1.1;
    include /etc/nginx/snippets/proxy-headers.conf;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
}

location ^~ /api/analytics/ {
    limit_req zone=analytics_zone burst=40 nodelay;
    proxy_pass http://blog_backend;
    proxy_http_version 1.1;
    include /etc/nginx/snippets/proxy-headers.conf;
}

location ~ ^/api/(upload|backup/|setup$) {
    limit_req zone=upload_zone burst=10 nodelay;
    proxy_pass http://blog_backend;
    proxy_http_version 1.1;
    include /etc/nginx/snippets/proxy-headers.conf;
}

location ~ ^/(?:(?:en|es)/)?login$ {
    limit_req zone=auth_zone burst=5 nodelay;
    proxy_pass http://blog_backend;
    proxy_http_version 1.1;
    include /etc/nginx/snippets/proxy-headers.conf;
}

location / {
    proxy_pass http://blog_backend;
    proxy_http_version 1.1;
    include /etc/nginx/snippets/proxy-headers.conf;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_cache_bypass $http_upgrade;
}
