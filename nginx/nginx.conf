events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;
    sendfile        on;
    keepalive_timeout  65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Reverse-proxy rate limiting zones by client IP
    limit_req_status 429;
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=upload_zone:10m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=analytics_zone:10m rate=120r/m;

    client_max_body_size 110M;
    proxy_connect_timeout 30s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    include /etc/nginx/conf.d/*.conf;

    # Resolve the visitor IP from Cloudflare's CF-Connecting-IP only when the
    # immediate peer belongs to a published Cloudflare edge range.
    include /etc/nginx/snippets/cloudflare-real-ip.conf;
    include /etc/nginx/snippets/cloudflare-country.conf;

    # Plain HTTP exists only for ACME HTTP-01 challenges and to redirect to HTTPS.
    server {
        listen 80;
        server_name _;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Public HTTPS reverse proxy.
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 1d;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        include /etc/nginx/snippets/proxy-locations.conf;
    }

    # Internal listener for compose health checks and the cron scheduler.
    # It is never published to the host, so background jobs keep working while
    # port 80 permanently redirects to HTTPS.
    server {
        listen 8080;
        server_name _;

        include /etc/nginx/snippets/proxy-locations.conf;
    }
}
